[project]
name = "homework3-gpt4-finetuning"
version = "0.1.0"
description = "GPT-4 model fine-tuning and benchmarking for hotel booking policy Q&A"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "openai>=1.12.0",
    "jsonlines>=4.0.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
